<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Non-Billable Time Analysis</title>
  <link rel="stylesheet" href="styles.css">
  <!-- Grist + Chart.js -->
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.7.0/chart.min.js"></script>
</head>
<body>
  <!-- DEBUG PANEL (Floating, hidden by default) -->
  <div id="debugPanel" class="debug-panel-hidden">
    <div class="debug-panel-header">
      <h3>Debug Console</h3>
      <button id="closeDebug" class="btn">✕</button>
    </div>
    <div style="display:flex; gap:10px; margin-bottom:10px;">
      <button id="clearDebug" class="btn">Clear Log</button>
      <button id="dumpRecords" class="btn">Dump Records</button>
      <button id="dumpFilters" class="btn">Dump Filters</button>
      <button id="dumpState" class="btn">Dump State</button>
    </div>
    <textarea id="debugOutput" readonly style="width:100%;height:250px;font-family:monospace;font-size:11px;background:#1e1e1e;color:#00ff00;padding:10px;border-radius:4px;"></textarea>
  </div>

  <!-- VIEW CONTROLS -->
  <div class="view-controls">
    <button id="barChart" class="active">Bar Chart</button>
    <button id="donutChart">Donut Chart</button>

    <div class="checkbox-wrapper">
      <input type="checkbox" id="groupTasks">
      <label for="groupTasks">Group Similar Tasks</label>
    </div>

    <button id="toggleDebug" class="debug-btn">Debug</button>
  </div>

  <!-- FILTERS -->
  <div class="filters">
    <select id="departmentFilter">
      <option value="all">All Departments</option>
    </select>

    <select id="locationFilter">
      <option value="all">All Locations</option>
    </select>

    <select id="groupFilter">
      <option value="all">All Groups</option>
    </select>

    <select id="userFilter">
      <option value="all">All Users</option>
    </select>

    <select id="projectFilter">
      <option value="all">All Projects</option>
    </select>

    <input type="date" id="startDate">
    <span style="margin: 0 5px;">to</span>
    <input type="date" id="endDate">

    <select id="sortFilter">
      <option value="name-asc">Name (A-Z)</option>
      <option value="project-asc">Project (A-Z)</option>
      <option value="hours-desc">Hours (High to Low)</option>
      <option value="hours-asc">Hours (Low to High)</option>
    </select>
  </div>

  <!-- SUMMARY STATISTICS BAR -->
  <div id="summaryStats" class="summary-stats">
    <div class="stat-item">
      <span class="stat-label">Total Non-Billable:</span>
      <span id="totalHours" class="stat-value">0h</span>
    </div>
    <div class="stat-item">
      <span class="stat-label">Avg Per Day:</span>
      <span id="avgHoursPerDay" class="stat-value">0h</span>
    </div>
    <div class="stat-item">
      <span class="stat-label">Top Project:</span>
      <span id="topProject" class="stat-value">-</span>
    </div>
    <div class="stat-item highlight">
      <span class="stat-label">PTO:</span>
      <span id="ptoHours" class="stat-value">0h</span>
    </div>
    <div class="stat-item highlight">
      <span class="stat-label">Holiday:</span>
      <span id="holidayHours" class="stat-value">0h</span>
    </div>
    <div class="stat-item highlight">
      <span class="stat-label">Meetings:</span>
      <span id="meetingHours" class="stat-value">0h</span>
    </div>
  </div>

  <!-- COLOR LEGEND -->
  <div class="color-legend">
    <div class="legend-item">
      <span class="legend-color" style="background-color: #4CAF50;"></span>
      <span class="legend-label">Billable %</span>
    </div>
    <div class="legend-item">
      <span class="legend-color" style="background-color: #FF9800;"></span>
      <span class="legend-label">Non-Billable %</span>
    </div>
  </div>

  <!-- CHARTS AREA -->
  <div class="chart-area">
    <div class="chart-wrapper">
      <canvas id="projectChart"></canvas>
    </div>
    <div class="chart-wrapper">
      <canvas id="taskChart"></canvas>
    </div>

    <!-- TASK DETAIL PANEL -->
    <div id="detailPanel" class="detail-panel">
      <h3 id="detailTitle">Task Details</h3>
      <table class="detail-table">
        <thead>
          <tr>
            <th data-sort="date" class="sort-desc">Date</th>
            <th data-sort="user">User</th>
            <th data-sort="duration" class="sort-desc">Duration</th>
            <th>Description</th>
          </tr>
        </thead>
        <tbody id="detailTableBody">
        </tbody>
      </table>
    </div>
  </div>

  <!-- Load external JavaScript -->
  <script src="scripts.js"></script>
</body>
</html>
